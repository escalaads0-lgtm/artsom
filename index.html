<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#FF2E2E}a:hover{color:#FF5C5C}
.glass{background:rgba(255,255,255,0.045);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.09);box-shadow:0 10px 40px -12px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.glass:hover{transform:translateY(-5px);border-color:rgba(229,0,0,0.35);box-shadow:0 22px 50px -14px rgba(196,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.12)}
.lift{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease}
.lift:hover{transform:translateY(-5px);box-shadow:0 26px 60px -18px rgba(196,0,0,0.65)}
.sidebar{width:76px;transition:width .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease}
.sidebar:hover,.sidebar:focus-within{width:236px;box-shadow:0 30px 70px -20px rgba(0,0,0,0.9),0 0 40px -10px rgba(196,0,0,0.35)}
.nav-label{opacity:0;transform:translateX(-8px);white-space:nowrap;font-size:14px;font-weight:600;transition:opacity .25s ease,transform .3s ease}
.sidebar:hover .nav-label,.sidebar:focus-within .nav-label{opacity:1;transform:translateX(0);transition-delay:.12s}
.sidebar .nav-btn svg{flex:none;width:20px;height:20px}
.sidebar svg{flex:none}
.nav-btn{overflow:hidden;transition:background .25s ease,color .25s ease,transform .25s ease}
.nav-btn:hover{background:rgba(255,255,255,0.14);color:#FFFFFF;transform:translateX(3px)}
.nav-btn.active:hover{background:#E50000;color:#FFFFFF}
.btn{transition:transform .2s ease,box-shadow .25s ease,background .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px rgba(229,0,0,0.75)}
.row-hover{transition:background .2s ease,transform .2s ease}
.row-hover:hover{background:rgba(255,255,255,0.06);transform:translateX(4px)}
.bar{transition:height .6s cubic-bezier(.2,.8,.2,1),filter .2s ease}
.bar:hover{filter:brightness(1.12)}
.pill{transition:background .2s ease,color .2s ease}
.day{transition:background .2s ease,transform .2s ease}
.day:hover{transform:translateY(-3px)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="position: relative; overflow: hidden; min-height: 100vh; box-sizing: border-box; padding: 28px 24px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FAFAFA; background: #09090B">
<div aria-hidden="true" style="position: absolute; top: -160px; left: 22%; width: 560px; height: 560px; border-radius: 50%; background: #C40000; filter: blur(150px); opacity: 0.22"></div>
<div aria-hidden="true" style="position: absolute; top: 520px; right: -120px; width: 520px; height: 520px; border-radius: 50%; background: #B00000; filter: blur(150px); opacity: 0.2"></div>
<div aria-hidden="true" style="position: absolute; bottom: -180px; left: -120px; width: 480px; height: 480px; border-radius: 50%; background: #5C0000; filter: blur(130px); opacity: 0.35"></div>

<div style="position: relative; max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<div style="flex: 0 0 76px; position: relative; z-index: 20; align-self: stretch; min-height: 640px">
<nav class="sidebar" aria-label="Menu principal" style="position: absolute; top: 0; left: 0; overflow: hidden; box-sizing: border-box; padding: 18px 15px; border-radius: 30px; background: linear-gradient(180deg, #18181B 0%, #1C0A0C 100%); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px -16px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: stretch; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-left: 1px">
<div style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: linear-gradient(135deg, #FF2E2E, #C40000); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(229,0,0,0.6)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
</div>
<span class="nav-label" style="font-size: 17px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em">Finanças</span>
</div>
<button class="nav-btn active" aria-label="Visão geral" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: #E50000; color: #FFFFFF; box-shadow: 0 8px 22px -8px rgba(229,0,0,0.8); display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
<span class="nav-label">Visão geral</span>
</button>
<button class="nav-btn" aria-label="Carteiras" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>
<span class="nav-label">Carteiras</span>
</button>
<button class="nav-btn" aria-label="Transações" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>
<span class="nav-label">Transações</span>
</button>
<button class="nav-btn" aria-label="Cartões" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
<span class="nav-label">Cartões</span>
</button>
<button class="nav-btn" aria-label="Relatórios" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
<span class="nav-label">Relatórios</span>
</button>
<button class="nav-btn" aria-label="Metas" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
<span class="nav-label">Metas</span>
</button>
<div style="height: 1px; width: 100%; background: rgba(255,255,255,0.1); margin: 8px 0"></div>
<button class="nav-btn" aria-label="Notificações" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span class="nav-label">Notificações</span>
</button>
<button class="nav-btn" aria-label="Configurações" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" y1="4" x2="14" y2="4"></line><line x1="10" y1="4" x2="3" y2="4"></line><line x1="21" y1="12" x2="12" y2="12"></line><line x1="8" y1="12" x2="3" y2="12"></line><line x1="21" y1="20" x2="16" y2="20"></line><line x1="12" y1="20" x2="3" y2="20"></line><line x1="14" y1="2" x2="14" y2="6"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="16" y1="18" x2="16" y2="22"></line></svg>
<span class="nav-label">Configurações</span>
</button>
</nav>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<section class="lift" style="flex: 2 1 520px; position: relative; overflow: hidden; box-sizing: border-box; padding: 34px 36px; border-radius: 30px; background: linear-gradient(135deg, #1A0508 0%, #5C0000 55%, #C40000 100%); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px -18px rgba(196,0,0,0.55)">
<div aria-hidden="true" style="position: absolute; right: -60px; top: -80px; width: 300px; height: 300px; border-radius: 50%; background: #FF2E2E; filter: blur(70px); opacity: 0.45"></div>
<div aria-hidden="true" style="position: absolute; right: 40px; bottom: -40px; width: 180px; height: 180px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18)"></div>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 28px; justify-content: space-between; align-items: flex-end">
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); color: #FFC2C2">Novembro · 2026</span>
<h1 style="margin: 0; font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Seu dinheiro, <span style="font-style: italic; color: #FF5C5C">sob controle</span></h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #E4E4E7; max-width: 420px">Acompanhe entradas, saídas e metas em um só lugar e veja para onde cada real está indo.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px">
<button class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 999px; background: #FFFFFF; color: #B00000; font-size: 14px; font-weight: 700; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Nova transação</button>
<button class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Ver relatório</button>
</div>
</div>
<div style="flex: 0 1 auto; display: flex; flex-direction: column; gap: 6px; padding: 20px 24px; border-radius: 22px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(14px)">
<span style="font-size: 13px; color: #FFC2C2">Saldo total</span>
<span style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em">R$ 48.320,90</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4ADE80">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>+8,2% em relação a outubro</span>
</div>
</div>
</section>

<section class="glass" style="flex: 1 1 320px; box-sizing: border-box; padding: 26px; border-radius: 30px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Novembro, 2026</h2>
<div style="display: flex; gap: 6px">
<button aria-label="Semana anterior" style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #F4F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button aria-label="Próxima semana" style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #F4F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}">
<div class="day" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 16px; background: linear-gradient(180deg, #E50000, #8B0000); color: #FFFFFF; box-shadow: 0 10px 22px -8px rgba(229,0,0,0.7)">
<span style="font-size: 11px; font-weight: 600; color: #FFC2C2">{{ d.wd }}</span>
<span style="font-size: 17px; font-weight: 700">{{ d.n }}</span>
<span style="width: 5px; height: 5px; border-radius: 50%; background: #FFFFFF"></span>
</div>
</sc-if>
<sc-if value="{{ d.other }}" hint-placeholder-val="{{ true }}">
<div class="day" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06)">
<span style="font-size: 11px; font-weight: 600; color: #8B8B94">{{ d.wd }}</span>
<span style="font-size: 17px; font-weight: 700; color: #FAFAFA">{{ d.n }}</span>
<span style="width: 5px; height: 5px; border-radius: 50%; background: {{ d.dot }}"></span>
</div>
</sc-if>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #A1A1AA; text-transform: uppercase; letter-spacing: 0.06em">Próximas contas</span>
<sc-for list="{{ bills }}" as="b" hint-placeholder-count="3">
<div class="row-hover" style="display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px">
<div style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: rgba(229,0,0,0.16); color: #FF5C5C; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
<span style="font-size: 15px; font-weight: 800">{{ b.day }}</span>
<span style="font-size: 9px; font-weight: 700">NOV</span>
</div>
<span style="flex: 1; font-size: 14px; font-weight: 600">{{ b.name }}</span>
<span style="font-size: 14px; font-weight: 700; color: #FAFAFA">{{ b.value }}</span>
</div>
</sc-for>
</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
<section class="glass" style="flex: 1 1 220px; box-sizing: border-box; padding: 22px 24px; border-radius: 26px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 600; color: #A1A1AA">{{ k.label }}</span>
<span style="width: 38px; height: 38px; border-radius: 12px; background: {{ k.chip }}; color: {{ k.chipInk }}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ k.icon1 }}"></path><path d="{{ k.icon2 }}"></path></svg>
</span>
</div>
<span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">{{ k.value }}</span>
<div style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden">
<div style="height: 100%; width: {{ k.pct }}%; border-radius: 999px; background: {{ k.bar }}"></div>
</div>
<span style="font-size: 13px; font-weight: 600; color: {{ k.noteInk }}">{{ k.note }}</span>
</section>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<section class="glass" style="flex: 2 1 520px; box-sizing: border-box; padding: 26px 28px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Fluxo de caixa</h2>
<span style="font-size: 13px; color: #A1A1AA">Entradas <strong style="color: #4ADE80">{{ inTotal }}</strong> · Saídas <strong style="color: #D4D4D8">{{ outTotal }}</strong></span>
</div>
<div role="group" aria-label="Período" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{ periods }}" as="p" hint-placeholder-count="2">
<sc-if value="{{ p.active }}" hint-placeholder-val="{{ false }}">
<button class="pill" onClick="{{ p.pick }}" aria-pressed="true" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #C40000; color: #FFFFFF; box-shadow: 0 6px 16px -6px rgba(229,0,0,0.8); font-size: 13px; font-weight: 700; cursor: pointer">{{ p.label }}</button>
</sc-if>
<sc-if value="{{ p.inactive }}" hint-placeholder-val="{{ true }}">
<button class="pill" onClick="{{ p.pick }}" aria-pressed="false" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #D4D4D8; font-size: 13px; font-weight: 600; cursor: pointer">{{ p.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 18px; font-size: 12px; font-weight: 600; color: #A1A1AA">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #22C55E"></span>Entradas</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A1A1AA"></span>Saídas</span>
</div>
<div role="img" aria-label="{{ chartLabel }}" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; height: 220px; padding: 0 4px; border-bottom: 1px dashed rgba(255,255,255,0.18); background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 100% 55px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end">
<div style="display: flex; align-items: flex-end; gap: 5px; height: 190px">
<div class="bar" title="Entradas: {{ b.rTxt }}" style="width: 16px; height: {{ b.rh }}px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #4ADE80, #15803D); box-shadow: 0 6px 16px -6px rgba(34,197,94,0.6)"></div>
<div class="bar" title="Saídas: {{ b.dTxt }}" style="width: 16px; height: {{ b.dh }}px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #E4E4E7, #71717A)"></div>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 0 4px; margin-top: -8px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">

<script>
class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(p){ Object.assign(this.state, p); mount(); } }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 'mes', filter: 'todas' };
  }
  renderVals() {
    var brl = function (v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); };
    var self = this;
    var period = this.state.period;

    var monthly = [
      { label: 'Jun', r: 15200, d: 10400 },

    ];
    var data = period === 'mes' ? monthly : weekly;
    var max = 0;
    data.forEach(function (x) { max = Math.max(max, x.r, x.d); });
    var inSum = 0, outSum = 0;
    var bars = data.map(function (x) {
      inSum += x.r; outSum += x.d;
      return {
        label: x.label,
        rh: Math.max(4, Math.round(x.r / max * 180)),
        dh: Math.max(4, Math.round(x.d / max * 180)),
        rTxt: brl(x.r),
        dTxt: brl(x.d)
      };
    });

    var periods = [{ id: 'semana', label: 'Semanal' }, { id: 'mes', label: 'Mensal' }].map(function (p) {
      return { label: p.label, active: p.id === period, inactive: p.id !== period, pick: function () { self.setState({ period: p.id }); } };
    });

    var allTx = [
      { name: 'Cliente Studio Aurora', cat: 'Serviços', date: '14 nov', v: 4500, isIn: true },
      { name: 'Supermercado', cat: 'Alimentação', date: '13 nov', v: -486.9, isIn: false },
      { name: 'Projeto freelance', cat: 'Serviços', date: '12 nov', v: 1250, isIn: true },
      { name: 'Combustível', cat: 'Transporte', date: '11 nov', v: -280, isIn: false },

      if (filter === 'entradas') return t.isIn;
      if (filter === 'saidas') return !t.isIn;
      return true;
    }).slice(0, 6).map(function (t) {
      return {
        name: t.name, cat: t.cat, date: t.date,
        isIn: t.isIn, isOut: !t.isIn,
        value: (t.isIn ? '+ ' : '− ') + brl(Math.abs(t.v)),
        ink: t.isIn ? '#4ADE80' : '#D4D4D8'
      };
    });
    var filters = [{ id: 'todas', label: 'Todas' }, { id: 'entradas', label: 'Entradas' }, { id: 'saidas', label: 'Saídas' }].map(function (f) {
      return { label: f.label, active: f.id === filter, inactive: f.id !== filter, pick: function () { self.setState({ filter: f.id }); } };
    });

    var catRaw = [
      { name: 'Moradia', v: 3200, color: '#C40000' },
      { name: 'Alimentação', v: 2140, color: '#E50000' },
      { name: 'Outros', v: 1852.35, color: '#71717A' },

    ];
    var catTotal = catRaw.reduce(function (a, c) { return a + c.v; }, 0);
    var catMax = catRaw[0].v;
    var cats = catRaw.map(function (c) {
      return { name: c.name, value: brl(c.v), pct: Math.round(c.v / catTotal * 100), w: Math.round(c.v / catMax * 100), color: c.color };

    var goals = [

      { label: 'Economia do mês', value: 'R$ 8.577,65', pct: 46, note: '46% da receita guardada', noteInk: '#4ADE80', chip: 'rgba(229,0,0,0.16)', chipInk: '#FF5C5C', bar: 'linear-gradient(90deg, #FF5C5C, #E50000)', icon1: 'M22 7 13.5 15.5 8.5 10.5 2 17', icon2: 'M16 7h6v6' },

function get(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce(function(o,k){ return o == null ? undefined : o[k]; }, scope);
}
function interp(str, scope){
  var m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/);
  if (m) return get(m[1], scope);
  return str.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scope); return v == null ? '' : v; });
}
function render(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  var tag = node.localName;
  var kids = node.content ? node.content.childNodes : node.childNodes;
  if (tag === 'sc-for') {
    var list = get(node.getAttribute('list').replace(/[{}]/g,''), scope) || [];
    var as = node.getAttribute('as');
    list.forEach(function(item, i){ var sc = Object.create(scope); sc[as] = item; sc.$index = i; Array.prototype.forEach.call(kids, function(c){ render(c, sc, out); }); });
    return;
  }
  if (tag === 'sc-if') {
    if (interp(node.getAttribute('value'), scope)) Array.prototype.forEach.call(kids, function(c){ render(c, scope, out); });
    return;
  }
  var el = document.createElementNS(node.namespaceURI, node.localName);
  Array.prototype.forEach.call(node.attributes, function(a){
    if (a.name.indexOf('hint-') === 0) return;
    if (a.name === 'onclick') { var fn = interp(a.value, scope); if (typeof fn === 'function') el.addEventListener('click', fn); return; }
    el.setAttribute(a.name, String(interp(a.value, scope)));
  });
  Array.prototype.forEach.call(node.childNodes, function(c){ render(c, scope, el); });
  out.appendChild(el);
}
var comp = new Component({});
function mount(){
  var root = document.getElementById('app');
  var frag = document.createDocumentFragment();
  var scope = comp.renderVals();
  Array.prototype.forEach.call(document.getElementById('tpl').content.childNodes, function(c){ render(c, scope, frag); });
  root.replaceChildren(frag);
}
mount();
</script>
