<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#FF2E2E}a:hover{color:#FF5C5C}
.glass{background:rgba(255,255,255,0.045);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.09);box-shadow:0 10px 40px -12px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.glass:hover{transform:translateY(-5px);border-color:rgba(229,0,0,0.35);box-shadow:0 22px 50px -14px rgba(196,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.12)}
.lift{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease}
.lift:hover{transform:translateY(-5px);box-shadow:0 26px 60px -18px rgba(196,0,0,0.65)}
.sidebar{width:76px;transition:width .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease}
.sidebar:hover,.sidebar:has(:focus-visible){width:236px;box-shadow:0 30px 70px -20px rgba(0,0,0,0.9),0 0 40px -10px rgba(196,0,0,0.35)}
.nav-label{opacity:0;transform:translateX(-8px);white-space:nowrap;font-size:14px;font-weight:600;transition:opacity .25s ease,transform .3s ease}
.sidebar:hover .nav-label,.sidebar:has(:focus-visible) .nav-label{opacity:1;transform:translateX(0);transition-delay:.12s}
.sidebar .nav-btn svg{flex:none;width:20px;height:20px}
.sidebar svg{flex:none}
.nav-btn{overflow:hidden;transition:background .25s ease,color .25s ease,transform .25s ease}
.nav-btn:hover{background:rgba(255,255,255,0.14);color:#FFFFFF;transform:translateX(3px)}
.nav-btn.active:hover{background:#E50000;color:#FFFFFF}
.btn{transition:transform .2s ease,box-shadow .25s ease,background .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px rgba(229,0,0,0.75)}
.row-hover{transition:background .2s ease,transform .2s ease}
.row-hover:hover{background:rgba(255,255,255,0.06);transform:translateX(4px)}
.bar{transition:height .6s cubic-bezier(.2,.8,.2,1),filter .2s ease}
.bar:hover{filter:brightness(1.12)}
.pill{transition:background .2s ease,color .2s ease}
.day{transition:background .2s ease,transform .2s ease}
.day:hover{transform:translateY(-3px)}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.97);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0px)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.8);filter:blur(8px)}70%{opacity:1;filter:blur(0px)}100%{opacity:1;transform:none;filter:blur(0px)}}
@keyframes grow{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.screen{--base:0ms}
.screen ~ .screen{--base:140ms}
.screen > *:nth-child(1){--d:calc(var(--base) + 0ms)}
.screen > *:nth-child(2){--d:calc(var(--base) + 110ms)}
.screen > *:nth-child(3){--d:calc(var(--base) + 220ms)}
.screen > *:nth-child(4){--d:calc(var(--base) + 330ms)}
.screen > *:nth-child(5){--d:calc(var(--base) + 440ms)}
.screen > *:nth-child(6){--d:calc(var(--base) + 550ms)}
.screen > *:nth-child(7){--d:calc(var(--base) + 660ms)}
.screen > *:nth-child(8){--d:calc(var(--base) + 770ms)}
.screen *:nth-child(1){--r:0}
.screen *:nth-child(2){--r:1}
.screen *:nth-child(3){--r:2}
.screen *:nth-child(4){--r:3}
.screen *:nth-child(5){--r:4}
.screen *:nth-child(6){--r:5}
.screen *:nth-child(7){--r:6}
.screen *:nth-child(8){--r:7}
.screen *:nth-child(9){--r:8}
.screen *:nth-child(10){--r:9}
.screen *:nth-child(11){--r:10}
.screen *:nth-child(12){--r:11}
.screen *:nth-child(13){--r:12}
.screen *:nth-child(14){--r:13}
.screen *:nth-child(15){--r:14}
.screen *:nth-child(16){--r:15}
.screen *:nth-child(17){--r:16}
.screen *:nth-child(18){--r:17}
.screen *:nth-child(19){--r:18}
.screen *:nth-child(20){--r:19}
.screen *:nth-child(21){--r:20}
.screen *:nth-child(22){--r:21}
.screen *:nth-child(23){--r:22}
.screen *:nth-child(24){--r:23}
.screen *:nth-child(25){--r:24}
.screen *:nth-child(26){--r:25}
.screen *:nth-child(27){--r:26}
.screen *:nth-child(28){--r:27}
.screen *:nth-child(29){--r:28}
.screen *:nth-child(30){--r:29}
.screen *:nth-child(31){--r:30}
.screen *:nth-child(32){--r:31}
.screen *:nth-child(33){--r:32}
.screen *:nth-child(34){--r:33}
.screen *:nth-child(35){--r:34}
.screen *:nth-child(36){--r:35}
.screen *:nth-child(37){--r:36}
.screen *:nth-child(38){--r:37}
.screen *:nth-child(39){--r:38}
.screen *:nth-child(40){--r:39}
.screen *:nth-child(41){--r:40}
.screen *:nth-child(42){--r:41}
.glass.screen,.screen .glass,.screen .lift,.screen .anim{animation:rise .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--d,0ms) + var(--r,0) * 85ms)}
.glass.screen{animation-delay:var(--base)}
.screen .row-hover{animation:rise .65s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--d,0ms) + 220ms + var(--r,0) * 55ms)}
.screen .btn,.screen .pill{animation:pop .6s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--d,0ms) + 320ms + var(--r,0) * 70ms)}
.screen .cal-day{animation:pop .55s cubic-bezier(.34,1.4,.64,1) backwards;animation-delay:calc(var(--d,0ms) + 200ms + var(--r,0) * 14ms)}
.screen .bar{transform-origin:bottom;animation:grow .9s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--d,0ms) + 380ms + var(--r,0) * 60ms)}
.screen .fillbar{transform-origin:left;animation:fill 1.1s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--d,0ms) + 450ms)}
.no-anim .screen,.no-anim .screen *{animation:none !important}
@media (prefers-reduced-motion: reduce){.screen,.screen *{animation:none !important}}
.cal-day{transition:transform .2s ease,box-shadow .25s ease,background .2s ease}
.cal-day:hover{transform:translateY(-3px);box-shadow:0 10px 22px -10px rgba(229,0,0,0.6)}
.icon-btn{transition:background .2s ease,color .2s ease,transform .2s ease}
.icon-btn:hover{transform:scale(1.08);background:rgba(255,255,255,0.12)}
input{color-scheme:dark}
.chip-radio{position:relative;display:inline-flex}
.chip-radio input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip-radio span{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04);color:#D4D4D8;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease}
.chip-radio span:hover{transform:translateY(-2px)}
.chip-radio input:checked + span{background:#E50000;border-color:#E50000;color:#FFFFFF;box-shadow:0 6px 16px -6px rgba(229,0,0,0.8)}
.chip-radio input:checked + span i{background:#FFFFFF !important}
.chip-radio input:focus-visible + span{outline:2px solid #FF5C5C;outline-offset:2px}
.receive-btn{transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease}
.receive-btn:hover{background:#16A34A !important;border-color:#16A34A !important;color:#FFFFFF !important;transform:translateY(-2px)}
.receive-btn:hover .rb-label{font-size:0}
.receive-btn:hover .rb-label::after{content:"Marcar recebido";font-size:12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-backdrop{animation:fadeIn .3s ease both}
.modal-card{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.modal-card > *{animation:rise .55s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(90ms + var(--r,0) * 50ms)}
.modal-card > *:nth-child(1){--r:0}
.modal-card > *:nth-child(2){--r:1}
.modal-card > *:nth-child(3){--r:2}
.modal-card > *:nth-child(4){--r:3}
.modal-card > *:nth-child(5){--r:4}
.modal-card > *:nth-child(6){--r:5}
.modal-card > *:nth-child(7){--r:6}
.modal-card > *:nth-child(8){--r:7}
.modal-card > *:nth-child(9){--r:8}
.modal-card > *:nth-child(10){--r:9}
.modal-card > *:nth-child(11){--r:10}

.theme-opt{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.theme-opt:hover{transform:translateY(-3px)}


.scan-frame{position:absolute;inset:8% 5%;border:2px solid rgba(255,46,46,0.6);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,0.28)}
.scan-line{position:absolute;left:6%;right:6%;top:10%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#FF2E2E,transparent);box-shadow:0 0 18px 4px rgba(255,46,46,0.7);animation:scanMove 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes scanMove{from{top:10%}to{top:88%}}
.mic-orb{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FF5C5C,#C40000 60%,#7A0000);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 18px 40px -12px rgba(229,0,0,0.9);animation:breathe 1.6s ease-in-out infinite}
.mic-orb::before,.mic-orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,46,46,0.65);animation:ring 1.8s ease-out infinite}
.mic-orb::after{animation-delay:.9s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}


/* ---------- clientes e estoque ---------- */
.plate{display:inline-flex;align-items:center;padding:2px 8px 2px 8px;border-radius:6px;background:#FFFFFF;color:#111111;border:1.5px solid #1B3A8A;border-top-width:5px;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap;line-height:1.3}
.client-card{transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s ease,box-shadow .25s ease}
.client-card:hover{transform:translateY(-4px) !important;border-color:rgba(229,0,0,0.35) !important;box-shadow:0 18px 40px -20px rgba(229,0,0,0.5)}
.link-btn:hover{color:#FF5C5C !important;text-decoration:underline}
.field-hint[data-tone="ok"]{color:#4ADE80 !important}
.field-hint[data-tone="bad"]{color:#FF5C5C !important}
.field-hint[data-tone="warn"]{color:#FACC15 !important}
.field-hint[data-tone="wait"]{color:#A1A1AA !important}
.field-hint:empty{display:none}
.theme-light .field-hint[data-tone="ok"]{color:#15803D !important}
.theme-light .field-hint[data-tone="bad"]{color:#C40000 !important}
.theme-light .field-hint[data-tone="warn"]{color:#A16207 !important}
/* ---------- assistente de voz ---------- */
.fab-mic{position:fixed;right:24px;bottom:24px;z-index:190;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#FF5C5C,#E50000 55%,#8B0000);box-shadow:0 16px 36px -10px rgba(229,0,0,0.85),0 0 0 1px rgba(255,255,255,0.12) inset;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease}
.fab-mic.anim-in{animation:fabIn .6s cubic-bezier(.34,1.56,.64,1) .4s both}
.fab-mic::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,46,46,0.45);animation:ring 2.6s ease-out infinite}
.fab-mic:hover{transform:scale(1.08) translateY(-2px);box-shadow:0 22px 44px -10px rgba(229,0,0,0.95)}
.fab-mic:active{transform:scale(.94)}
.fab-mic.is-open{background:radial-gradient(circle at 35% 30%,#3F3F46,#18181B 70%);box-shadow:0 16px 36px -10px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.14) inset}
.fab-mic.is-open::before{border-color:rgba(255,255,255,0.18);animation:none;opacity:0}
.fab-mic.is-listening{animation:breathe 1.2s ease-in-out infinite}
.fab-mic.is-listening::before,.fab-mic.is-listening::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,46,46,0.7);animation:ring 1.4s ease-out infinite}
.fab-mic.is-listening::after{animation-delay:.7s}
@keyframes fabIn{from{opacity:0;transform:scale(.4) translateY(30px)}to{opacity:1;transform:none}}
.assist-panel{position:fixed;right:24px;bottom:100px;z-index:189;width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 140px);overflow:auto;box-sizing:border-box;padding:18px;border-radius:26px;background:rgba(20,20,22,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 40px 80px -30px rgba(0,0,0,0.9),0 0 60px -20px rgba(229,0,0,0.4);display:flex;flex-direction:column;gap:14px;transform-origin:bottom right}
.assist-panel.anim-in{animation:panelIn .45s cubic-bezier(.22,1,.36,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.92);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0px)}}
.assist-panel .mic-orb{width:84px;height:84px}
.assist-reply.anim-in{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.assist-chip{transition:background .2s ease,border-color .2s ease,transform .2s ease}
.assist-chip:hover{background:rgba(229,0,0,0.14) !important;border-color:rgba(229,0,0,0.45) !important;transform:translateY(-2px)}
.wave{display:flex;align-items:center;gap:4px;height:26px}
.wave i{display:block;width:4px;height:8px;border-radius:4px;background:#FF2E2E;animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
@keyframes wave{0%,100%{height:6px;opacity:.5}50%{height:26px;opacity:1}}
.theme-light .assist-panel{background:rgba(255,255,255,0.97);border-color:rgba(24,24,27,0.08);box-shadow:0 40px 80px -30px rgba(24,24,27,0.45)}
@media (max-width: 860px){
.fab-mic{right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px}
.assist-panel{right:12px;left:12px;width:auto;bottom:calc(156px + env(safe-area-inset-bottom));max-height:calc(100vh - 200px)}
}
@media (prefers-reduced-motion: reduce){.fab-mic,.fab-mic::before,.fab-mic::after,.assist-panel,.wave i{animation:none !important}}
/* ---------- celular e tablet ---------- */
@media (max-width: 860px){
.app-root{padding:16px 12px 104px !important}
.side-wrap{position:fixed !important;left:10px;right:10px;bottom:max(10px, env(safe-area-inset-bottom));min-height:0 !important;flex:none !important;z-index:150 !important}
.side-wrap .sidebar,.side-wrap .sidebar:hover,.side-wrap .sidebar:has(:focus-visible){position:relative !important;width:auto !important;flex-direction:row !important;align-items:center !important;gap:6px !important;padding:8px !important;border-radius:24px !important;overflow-x:auto !important;overflow-y:hidden !important;scrollbar-width:none;-webkit-overflow-scrolling:touch;box-shadow:0 16px 40px -10px rgba(0,0,0,0.85) !important}
.side-wrap .sidebar::-webkit-scrollbar{display:none}
.side-wrap .side-logo,.side-wrap .side-divider{display:none !important}
.side-wrap .nav-label{display:none !important}
.side-wrap .nav-btn{width:48px !important;height:48px !important;flex:0 0 48px !important;padding:0 !important;justify-content:center !important}
.side-wrap .nav-btn:hover{transform:none}
h1{font-size:28px !important}
.cal-day{min-height:56px !important;padding:7px 5px !important;border-radius:14px !important}
.cal-day span{font-size:15px}
div[aria-hidden="true"][style*="min-height: 78px"]{min-height:56px !important}
}

.theme-light{background:#F3F3F5 !important;color:#18181B !important}
.theme-light > div[aria-hidden]{opacity:.10 !important}
.theme-light .glass{background:rgba(255,255,255,0.86);border-color:rgba(24,24,27,0.07);box-shadow:0 10px 30px -14px rgba(24,24,27,0.18),inset 0 1px 0 #FFFFFF}

.theme-light .modal-card{background:#FFFFFF !important;border-color:rgba(24,24,27,0.08) !important;box-shadow:0 40px 80px -30px rgba(24,24,27,0.45) !important}

.theme-light [style*="color: rgb(255, 194, 194)"]:not(.lift *):not(nav *){color:#B00000 !important}
.theme-light [style*="color: rgb(250, 204, 21)"]:not(.lift *):not(nav *){color:#A16207 !important}
.theme-light [style*="color: rgb(96, 165, 250)"]:not(.lift *):not(nav *){color:#1D4ED8 !important}
.theme-light [style*="background: rgba(255, 255, 255, 0.0"]:not(.lift *):not(nav *),.theme-light [style*="background-color: rgba(255, 255, 255, 0.0"]:not(.lift *):not(nav *){background:rgba(24,24,27,0.045) !important}
.theme-light [style*="background: rgba(255, 255, 255, 0.1"]:not(.lift *):not(nav *){background:rgba(24,24,27,0.09) !important}
.theme-light [style*="solid rgba(255, 255, 255, 0."]:not(.lift *):not(nav *){border-color:rgba(24,24,27,0.1) !important}
.theme-light input:not(.lift *):not(nav *){color:#18181B !important;-webkit-text-fill-color:#18181B}
.theme-light input:not(.lift *):not(nav *)::placeholder{color:#8B8B94;-webkit-text-fill-color:#8B8B94}
.theme-light .receive-btn:not(.lift *):not(nav *){color:#A16207}

input:focus{border-color:#E50000 !important;box-shadow:0 0 0 4px rgba(229,0,0,0.22)}
input::placeholder{color:#8B8B94}
</style>
<script>if(new URLSearchParams(location.search).get('entrar')==='1'){document.documentElement.classList.add('intro');history.replaceState(null,'','/');}</script>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;display=swap" rel="stylesheet">
<style>
#intro{display:none}
html.intro #intro{display:flex;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#3A0507 0%,#120203 45%,#000000 100%)}
html.intro body{overflow:hidden}
.intro-fly{position:fixed;z-index:1001;transform-origin:0 0;pointer-events:none;margin:0}
.brand-logo{display:flex;align-items:center;gap:clamp(6px,1.5vw,14px)}
.brand-icon{width:clamp(110px,22vw,190px);height:auto;flex:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.brand-text{display:flex;flex-direction:column;line-height:.82;font-family:'Kaushan Script',cursive}
.brand-text .art{font-size:clamp(64px,13vw,124px);color:#FFFFFF;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.brand-text .som{font-size:clamp(42px,8.5vw,80px);color:#E50000;margin-left:clamp(26px,5vw,52px);margin-top:clamp(-4px,-.5vw,0px)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="app-root {{ themeClass }}" style="position: relative; overflow: hidden; min-height: 100vh; box-sizing: border-box; padding: 28px 24px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FAFAFA; background: #09090B">
<div aria-hidden="true" style="position: absolute; top: -160px; left: 22%; width: 560px; height: 560px; border-radius: 50%; background: #C40000; filter: blur(150px); opacity: 0.22"></div>
<div aria-hidden="true" style="position: absolute; top: 520px; right: -120px; width: 520px; height: 520px; border-radius: 50%; background: #B00000; filter: blur(150px); opacity: 0.2"></div>
<div aria-hidden="true" style="position: absolute; bottom: -180px; left: -120px; width: 480px; height: 480px; border-radius: 50%; background: #5C0000; filter: blur(130px); opacity: 0.35"></div>

<div style="position: relative; max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<div class="side-wrap" style="flex: 0 0 76px; position: relative; z-index: 20; align-self: stretch; min-height: 640px">
<nav class="sidebar" aria-label="Menu principal" style="position: absolute; top: 0; left: 0; overflow: hidden; box-sizing: border-box; padding: 18px 15px; border-radius: 30px; background: linear-gradient(180deg, #18181B 0%, #1C0A0C 100%); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px -16px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: stretch; gap: 10px">
<div class="side-logo" style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-left: 1px">
<div data-logo-slot="1" style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: linear-gradient(135deg, #FF2E2E, #C40000); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(229,0,0,0.6)">
<svg width="30" height="25" viewBox="0 0 120 100" aria-hidden="true"><g transform="translate(16 0) skewX(-10)"><path d="M4 37 L20 33 L20 67 L4 63 Z" fill="#FFFFFF"></path><path d="M25 32 L52 11 L52 89 L25 68 Z" fill="#FFFFFF"></path><path d="M64 37 Q71 50 64 63" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"></path><path d="M77 26 Q90 50 77 74" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"></path><path d="M90 15 Q110 50 90 85" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"></path></g></svg>
</div>
<span class="nav-label" style="font-size: 17px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em">ArtSom</span>
</div>
<sc-for list="{{ mainNav }}" as="n" hint-placeholder-count="4">
<sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
<button class="nav-btn active" onClick="{{ n.pick }}" aria-label="{{ n.label }}" aria-current="page" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: #E50000; color: #FFFFFF; box-shadow: 0 8px 22px -8px rgba(229,0,0,0.8); display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #C40000; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
<sc-if value="{{ n.inactive }}" hint-placeholder-val="{{ true }}">
<button class="nav-btn" onClick="{{ n.pick }}" aria-label="{{ n.label }}" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E50000; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
</sc-for>
<div class="side-divider" style="height: 1px; width: 100%; background: rgba(255,255,255,0.1); margin: 8px 0"></div>
<sc-for list="{{ sysNav }}" as="n" hint-placeholder-count="4">
<sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
<button class="nav-btn active" onClick="{{ n.pick }}" aria-label="{{ n.label }}" aria-current="page" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: #E50000; color: #FFFFFF; box-shadow: 0 8px 22px -8px rgba(229,0,0,0.8); display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #C40000; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
<sc-if value="{{ n.inactive }}" hint-placeholder-val="{{ true }}">
<button class="nav-btn" onClick="{{ n.pick }}" aria-label="{{ n.label }}" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E50000; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
</sc-for>
<a class="nav-btn" href="/api/logout" aria-label="Sair" style="width: 100%; height: 46px; flex: none; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
<span class="nav-label">Sair</span>
</a>
</nav>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-if value="{{ screens.overview }}" hint-placeholder-val="{{ true }}">
<div class="screen" style="display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch">
<section class="lift" style="flex: 1.5 1 400px; position: relative; overflow: hidden; box-sizing: border-box; padding: 24px 26px; border-radius: 28px; background: linear-gradient(135deg, #1A0508 0%, #5C0000 55%, #C40000 100%); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px -18px rgba(196,0,0,0.55); display: flex; flex-direction: column; gap: 16px">
<div aria-hidden="true" style="position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: #FF2E2E; filter: blur(70px); opacity: 0.45"></div>
<div aria-hidden="true" style="position: absolute; right: 30px; bottom: -60px; width: 170px; height: 170px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.16)"></div>
<span style="position: relative; align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); color: #FFC2C2">Novembro · 2026</span>
<h1 style="position: relative; margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Seu dinheiro, <span style="font-style: italic; color: #FF5C5C">sob controle</span></h1>
<div style="position: relative; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #FFC2C2">Saldo total</span>
<span style="font-size: 38px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">R$ 48.320,90</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4ADE80"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>+8,2% em relação a outubro</span>
</div>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto">
<button class="btn" onClick="{{ newSale }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #FFFFFF; color: #B00000; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Nova venda</button>
<button class="btn" onClick="{{ go.reports }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Ver relatório</button>
</div>
</section>

<section class="glass" style="flex: 1 1 300px; box-sizing: border-box; padding: 22px; border-radius: 28px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Resumo do mês</h2>
<span style="font-size: 12px; color: #A1A1AA">Novembro</span>
</div>
<sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
<div class="row-hover" style="display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 14px">
<span style="width: 38px; height: 38px; flex: none; border-radius: 12px; background: {{ k.chip }}; color: {{ k.chipInk }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ k.icon }}"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="flex: 1; min-width: 0; font-size: 12.5px; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ k.label }}</span>
<span style="font-size: 15px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap">{{ k.value }}</span>
</div>
<div style="height: 5px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden"><div class="fillbar" style="height: 100%; width: {{ k.pct }}%; border-radius: 999px; background: {{ k.bar }}"></div></div>
<span style="font-size: 11.5px; font-weight: 600; color: {{ k.noteInk }}">{{ k.note }}</span>
</div>
</div>
</sc-for>
</section>

<section class="glass" style="flex: 1 1 300px; box-sizing: border-box; padding: 22px; border-radius: 28px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">A seguir</h2>
<button class="pill" onClick="{{ go.agenda }}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #D4D4D8; font-size: 12px; font-weight: 700; cursor: pointer">Abrir agenda</button>
</div>
<sc-for list="{{ nextUp }}" as="u" hint-placeholder-count="4">
<div class="row-hover" style="display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 14px">
<div style="width: 44px; height: 44px; flex: none; border-radius: 13px; background: {{ u.chip }}; color: {{ u.color }}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
<span style="font-size: 16px; font-weight: 800">{{ u.n }}</span>
<span style="font-size: 9px; font-weight: 700; text-transform: uppercase">{{ u.mon }}</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ u.title }}</span>
<span style="font-size: 12px; color: #8B8B94">{{ u.sub }}</span>
</div>
<span style="font-size: 13px; font-weight: 800; color: {{ u.ink }}; white-space: nowrap">{{ u.value }}</span>
</div>
</sc-for>
<button class="btn" onClick="{{ go.today }}" style="min-height: 42px; margin-top: auto; border: 0; border-radius: 999px; background: linear-gradient(135deg, #E50000, #8B0000); color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">Ver o que acontece hoje</button>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<section class="glass" style="flex: 2 1 520px; box-sizing: border-box; padding: 26px 28px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Fluxo de caixa</h2>
<span style="font-size: 13px; color: #A1A1AA">Entradas <strong style="color: #4ADE80">{{ inTotal }}</strong> · Saídas <strong style="color: #D4D4D8">{{ outTotal }}</strong></span>
</div>
<div role="group" aria-label="Período" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{ periods }}" as="p" hint-placeholder-count="2">
<sc-if value="{{ p.active }}" hint-placeholder-val="{{ false }}">
<button class="pill" onClick="{{ p.pick }}" aria-pressed="true" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #C40000; color: #FFFFFF; box-shadow: 0 6px 16px -6px rgba(229,0,0,0.8); font-size: 13px; font-weight: 700; cursor: pointer">{{ p.label }}</button>
</sc-if>
<sc-if value="{{ p.inactive }}" hint-placeholder-val="{{ true }}">
<button class="pill" onClick="{{ p.pick }}" aria-pressed="false" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #D4D4D8; font-size: 13px; font-weight: 600; cursor: pointer">{{ p.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 18px; font-size: 12px; font-weight: 600; color: #A1A1AA">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #22C55E"></span>Entradas</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A1A1AA"></span>Saídas</span>
</div>
<div role="img" aria-label="{{ chartLabel }}" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; height: 220px; padding: 0 4px; border-bottom: 1px dashed rgba(255,255,255,0.18); background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 100% 55px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end">
<div style="display: flex; align-items: flex-end; gap: 5px; height: 190px">
<div class="bar" title="Entradas: {{ b.rTxt }}" style="width: 16px; height: {{ b.rh }}px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #4ADE80, #15803D); box-shadow: 0 6px 16px -6px rgba(34,197,94,0.6)"></div>
<div class="bar" title="Saídas: {{ b.dTxt }}" style="width: 16px; height: {{ b.dh }}px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #E4E4E7, #71717A)"></div>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 0 4px; margin-top: -8px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
<span style="flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: #A1A1AA">{{ b.label }}</span>
</sc-for>
</div>
</section>

<section class="glass" style="flex: 1 1 300px; box-sizing: border-box; padding: 26px; border-radius: 30px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Metas</h2>
<button class="btn" aria-label="Adicionar meta" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #C40000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</div>
<sc-for list="{{ goals }}" as="g" hint-placeholder-count="3">
<div class="row-hover" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 700">{{ g.name }}</span>
<span style="font-size: 15px; font-weight: 800; color: #FF2E2E">{{ g.pct }}%</span>
</div>
<div style="height: 10px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden">
<div class="fillbar" style="height: 100%; width: {{ g.pct }}%; border-radius: 999px; background: linear-gradient(90deg, #FF2E2E, #C40000); box-shadow: 0 0 12px rgba(229,0,0,0.6)"></div>
</div>
<span style="font-size: 12px; font-weight: 500; color: #A1A1AA">{{ g.saved }} de {{ g.target }}</span>
</div>
</sc-for>
</section>

<script>
class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(p){ Object.assign(this.state, p); mount(); } }

var BOLETO = (function () {
  var BANKS = { '001': 'Banco do Brasil', '033': 'Santander', '041': 'Banrisul', '070': 'BRB', '077': 'Inter', '104': 'Caixa', '208': 'BTG Pactual',
    '212': 'Banco Original', '237': 'Bradesco', '260': 'Nubank', '290': 'PagBank', '323': 'Mercado Pago', '336': 'C6 Bank', '341': 'Itaú',
    '380': 'PicPay', '389': 'Mercantil', '422': 'Safra', '633': 'Rendimento', '655': 'Votorantim', '745': 'Citibank', '748': 'Sicredi', '756': 'Sicoob' };
  var SEGMENTS = {
    '1': { name: 'Taxa da prefeitura', kind: 'Imposto' }, '2': { name: 'Conta de água', kind: 'Conta fixa' },
    '3': { name: 'Conta de luz', kind: 'Conta fixa' }, '4': { name: 'Telefone e internet', kind: 'Conta fixa' },
    '5': { name: 'Imposto / guia do governo', kind: 'Imposto' }, '6': { name: 'Carnê', kind: 'Gasto' },
    '7': { name: 'Multa de trânsito', kind: 'Gasto' }, '9': { name: 'Boleto de convênio', kind: 'Gasto' }
  };
  var digits = function (s) { return String(s || '').replace(/\D/g, ''); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var isoOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var mod10 = function (num) {
    var sum = 0, w = 2;

  };
  var mod11 = function (num, bank) {
    var sum = 0, w = 2;

  };
  var validBankBarcode = function (bc) { return bc.length === 44 && bc[0] !== '8' && mod11(bc.slice(0, 4) + bc.slice(5), true) === +bc[4]; };
  var validConvBarcode = function (bc) {
    if (bc.length !== 44 || bc[0] !== '8') return false;
    var f = (bc[2] === '7' || bc[2] === '9') ? mod11 : mod10;
    return f(bc.slice(0, 3) + bc.slice(4)) === +bc[3];
  };
  var bankLineToBarcode = function (ld) {
    return ld.slice(0, 4) + ld.slice(32, 33) + ld.slice(33, 47) + ld.slice(4, 9) + ld.slice(10, 20) + ld.slice(21, 31);
  };
  var validBankLine = function (ld) {
    return ld.length === 47 && mod10(ld.slice(0, 9)) === +ld[9] && mod10(ld.slice(10, 20)) === +ld[20] && mod10(ld.slice(21, 31)) === +ld[31] && validBankBarcode(bankLineToBarcode(ld));
  };
  var validConvLine = function (ld) {
    if (ld.length !== 48 || ld[0] !== '8') return false;
    var f = (ld[2] === '7' || ld[2] === '9') ? mod11 : mod10;
    for (var b = 0; b < 4; b++) { var blk = ld.slice(b * 12, b * 12 + 11); if (f(blk) !== +ld[b * 12 + 11]) return false; }
    return true;
  };
  var convLineToBarcode = function (ld) { return ld.slice(0, 11) + ld.slice(12, 23) + ld.slice(24, 35) + ld.slice(36, 47); };
  var dueFromFactor = function (f) {
    if (!f) return '';
    var old = new Date(1997, 9, 7); old.setDate(old.getDate() + f);
    if (old >= new Date(2023, 0, 1)) return isoOf(old);
    var nw = new Date(2025, 1, 22); nw.setDate(nw.getDate() + (f - 1000));
    return isoOf(nw);
  };
  var formatLine = function (code) {
    if (code.length === 47) return code.slice(0, 5) + '.' + code.slice(5, 10) + ' ' + code.slice(10, 15) + '.' + code.slice(15, 21) + ' ' + code.slice(21, 26) + '.' + code.slice(26, 32) + ' ' + code[32] + ' ' + code.slice(33);
    if (code.length === 48) return code.slice(0, 12) + ' ' + code.slice(12, 24) + ' ' + code.slice(24, 36) + ' ' + code.slice(36);
    return code;
  };
  // code: 44 (código de barras), 47 (linha digitável bancária) ou 48 (convênio / concessionária)
  var decode = function (raw) {
    var c = digits(raw), bc, line = c;
    if (c.length === 47 && validBankLine(c)) bc = bankLineToBarcode(c);
    else if (c.length === 48 && validConvLine(c)) bc = convLineToBarcode(c);
    else if (c.length === 44 && (validBankBarcode(c) || validConvBarcode(c))) bc = c;
    else return null;
    if (bc[0] === '8') {
      var seg = SEGMENTS[bc[1]] || { name: 'Conta', kind: 'Conta fixa' };
      var value = (bc[2] === '6' || bc[2] === '7') ? +bc.slice(4, 15) / 100 : 0;
      var date = '';
      var y = +bc.slice(19, 23), m = +bc.slice(23, 25), d = +bc.slice(25, 27);

      return { type: 'convenio', code: line, codeLabel: formatLine(line), name: seg.name, kind: seg.kind, value: value, date: date };
    }
    var bank = BANKS[bc.slice(0, 3)];
    return { type: 'banco', code: line, codeLabel: formatLine(line), name: 'Boleto' + (bank ? ' ' + bank : ''), bank: bank || '', kind: 'Fornecedor',

  };
  var findInDigits = function (all) {
    var sizes = [47, 48, 44];

    return null;
  };
  var money = function (s) {
    s = String(s || '').replace(/[^\d,.]/g, '');

    else if (/\.\d{3}$/.test(s)) s = s.replace(/\./g, '');

  };
  // texto do OCR: primeiro procura a linha digitável; se não achar, tenta valor, vencimento e beneficiário
  var fromText = function (text) {
    var t = String(text || '');
    var byLine = t.split(/\n/).map(digits).filter(function (x) { return x.length >= 20; });
    for (var k = 0; k < byLine.length; k++) { var hit = findInDigits(byLine[k]) || (byLine[k + 1] ? findInDigits(byLine[k] + byLine[k + 1]) : null); if (hit) return hit; }
    var hit2 = findInDigits(digits(t));
    if (hit2) return hit2;
    var low = t.toLowerCase();
    var value = 0, date = '', name = '';
    var mv = low.match(/valor (?:do )?(?:documento|cobrado|a pagar|total)[^\d]{0,40}([\d\.]+,\d{2})/) || low.match(/r\$\s*([\d\.]+,\d{2})/);
    if (mv) value = money(mv[1]);
    var md = low.match(/vencimento[^\d]{0,40}(\d{2})\/(\d{2})\/(\d{4})/) || low.match(/(\d{2})\/(\d{2})\/(20\d{2})/);
    if (md) date = md[3] + '-' + md[2] + '-' + md[1];
    var mb = t.match(/benefici[aá]rio[:\s]*([^\n]{3,60})/i);
    if (mb) name = mb[1].replace(/\s+/g, ' ').replace(/[^\wÀ-ú .&-]/g, '').trim();
    if (!value && !date) return null;
    return { type: 'texto', code: '', codeLabel: '', name: name ? 'Boleto ' + name : 'Boleto', kind: 'Fornecedor', value: value, date: date };
  };

  // ---------- fala ----------
  var MONTHS = { janeiro: 1, fevereiro: 2, 'março': 3, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };
  var WORDNUM = { um: 1, uma: 1, dois: 2, duas: 2, 'três': 3, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12,
    treze: 13, quatorze: 14, catorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19, vinte: 20, trinta: 30, quarenta: 40,
    cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90, cem: 100, cento: 100, duzentos: 200, trezentos: 300, quatrocentos: 400,
    quinhentos: 500, seiscentos: 600, setecentos: 700, oitocentos: 800, novecentos: 900 };
  var wordsToNumbers = function (s) {
    return s.replace(/\b((?:(?:um|uma|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|cem|cento|duzentos|trezentos|quatrocentos|quinhentos|seiscentos|setecentos|oitocentos|novecentos|mil)(?:\s+e\s+|\s+|\b))+)/g, function (m) {
      var ws = m.trim().split(/\s+/).filter(function (w) { return w !== 'e'; });
      if (ws.length === 1 && (ws[0] === 'um' || ws[0] === 'uma' || ws[0] === 'mil')) return m;
      var total = 0, cur = 0, any = false;
      m.trim().split(/\s+/).forEach(function (w) {
        if (w === 'e') return;
        if (w === 'mil') { total += (cur || 1) * 1000; cur = 0; any = true; return; }
        if (WORDNUM[w] !== undefined) { cur += WORDNUM[w]; any = true; }
      });
      return any ? ' ' + (total + cur) + ' ' : m;
    });
  };
  var KINDS = [
    { re: /an[uú]ncios?|facebook ads|meta ads|google ads|impulsionamento|impulsionar/, kind: 'Anúncios', name: 'Anúncios' },
    { re: /insumos?|fita isolante|terminais|abra[cç]adeiras?/, kind: 'Insumos', name: 'Insumos' },
    { re: /gestor de tr[aá]fego|tr[aá]fego pago|ag[eê]ncia de marketing|marketing/, kind: 'Serviços', name: 'Gestor de tráfego' },
    { re: /contabilidade|contador|contadora|escrit[oó]rio cont/, kind: 'Serviços', name: 'Contabilidade' },
    { re: /\bdas\b|simples nacional/, kind: 'Imposto', name: 'DAS — Simples Nacional' },
    { re: /fgts/, kind: 'Imposto', name: 'FGTS' }, { re: /inss/, kind: 'Imposto', name: 'INSS' },
    { re: /\biss\b|icms|darf|iptu|ipva|imposto|tributo|taxa/, kind: 'Imposto', name: 'Impostos' },
    { re: /folha|sal[aá]rio|funcion[aá]ri|vale|adiantamento|pro.?labore/, kind: 'Folha de pagamento', name: 'Folha de pagamento' },
    { re: /\bluz\b|energia/, kind: 'Conta fixa', name: 'Conta de luz' }, { re: /[aá]gua|esgoto/, kind: 'Conta fixa', name: 'Conta de água' },
    { re: /internet/, kind: 'Conta fixa', name: 'Internet' }, { re: /telefone|celular/, kind: 'Conta fixa', name: 'Telefone' }, { re: /aluguel/, kind: 'Conta fixa', name: 'Aluguel da loja' },
    { re: /fornecedor|mercadoria|estoque|pe[cç]as|distribuidora/, kind: 'Fornecedor', name: 'Fornecedor' }
  ];
  var cap = function (s) { s = s.trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; };
  var parseSpeech = function (text, todayIso) {
    var raw = String(text || '').trim();
    var s = ' ' + wordsToNumbers(raw.toLowerCase()) + ' ';
    var value = 0, m;
    if ((m = s.match(/r\$\s*([\d\.]+(?:,\d{1,2})?)/))) value = money(m[1]);
    else if ((m = s.match(/(\d+(?:[.,]\d+)?)\s*mil(?:\s*(?:e\s*)?(\d{1,3}))?\s*(?:reais|real)?/)) && /mil/.test(m[0])) value = money(m[1]) * 1000 + (m[2] ? +m[2] : 0);
    else if ((m = s.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:reais|real|conto|contos|pila)(?:\s*e\s*(\d{1,2})(?:\s*centavos)?)?/))) value = money(m[1]) + (m[2] ? +m[2] / 100 : 0);

<script>
(function(){
  if (!document.documentElement.classList.contains('intro')) return;
  // Grade de tempo da animação (ms). Tudo parte do mesmo relógio, então os trechos se sobrepõem sem trancos.
  var HOLD = 60;
  var T = {
    textOut: [HOLD + 0,   HOLD + 300],   // "ArtSom" desaparece
    iconFly: [HOLD + 90,  HOLD + 820],   // ícone sobe para o topo da barra lateral
    reveal:  [HOLD + 300, HOLD + 960],   // fundo se fecha para dentro do ícone
    appIn:   [HOLD + 320, HOLD + 900]    // dashboard aparece

  var EASE_IN_OUT = 'cubic-bezier(.5,0,.15,1)';
  var EASE_OUT = 'cubic-bezier(.22,1,.36,1)';
  var EASE_REVEAL = 'cubic-bezier(.7,0,.2,1)';

    var app = document.getElementById('app');

    var text = overlay.querySelector('.brand-text');
    var slot = document.querySelector('[data-logo-slot] svg');
    if (!slot || slot.getBoundingClientRect().width === 0) slot = document.querySelector('nav .nav-btn.active svg');

    fly.style.left = a.left + 'px'; fly.style.top = a.top + 'px';
    fly.style.width = a.width + 'px'; fly.style.height = a.height + 'px';
    document.body.appendChild(fly);
    icon.style.visibility = 'hidden';
    slot.style.opacity = '0';

    var cx = b.left + b.width / 2, cy = b.top + b.height / 2;

        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (s*1.14) + ') rotate(2deg)', offset: 0.86 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ') rotate(0deg)', filter: 'drop-shadow(0 0 0 rgba(0,0,0,0))', offset: 1 }
