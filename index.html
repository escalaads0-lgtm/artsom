<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#FF2E2E}a:hover{color:#FF5C5C}
.glass{background:rgba(255,255,255,0.045);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.09);box-shadow:0 10px 40px -12px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.glass:hover{transform:translateY(-5px);border-color:rgba(229,0,0,0.35);box-shadow:0 22px 50px -14px rgba(196,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.12)}
.lift{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease}
.lift:hover{transform:translateY(-5px);box-shadow:0 26px 60px -18px rgba(196,0,0,0.65)}
.sidebar{width:76px;transition:width .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease}
.sidebar:hover,.sidebar:has(:focus-visible){width:236px;box-shadow:0 30px 70px -20px rgba(0,0,0,0.9),0 0 40px -10px rgba(196,0,0,0.35)}
.nav-label{opacity:0;transform:translateX(-8px);white-space:nowrap;font-size:14px;font-weight:600;transition:opacity .25s ease,transform .3s ease}
.sidebar:hover .nav-label,.sidebar:has(:focus-visible) .nav-label{opacity:1;transform:translateX(0);transition-delay:.12s}
.sidebar .nav-btn svg{flex:none;width:20px;height:20px}
.sidebar svg{flex:none}
.nav-btn{overflow:hidden;transition:background .25s ease,color .25s ease,transform .25s ease}
.nav-btn:hover{background:rgba(255,255,255,0.14);color:#FFFFFF;transform:translateX(3px)}
.nav-btn.active:hover{background:#E50000;color:#FFFFFF}
.btn{transition:transform .2s ease,box-shadow .25s ease,background .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px rgba(229,0,0,0.75)}
.row-hover{transition:background .2s ease,transform .2s ease}
.row-hover:hover{background:rgba(255,255,255,0.06);transform:translateX(4px)}
.bar{transition:height .6s cubic-bezier(.2,.8,.2,1),filter .2s ease}
.bar:hover{filter:brightness(1.12)}
.pill{transition:background .2s ease,color .2s ease}
.day{transition:background .2s ease,transform .2s ease}
.day:hover{transform:translateY(-3px)}
button{font-family:inherit}
.screen{animation:screenIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}}
input::placeholder{color:#8B8B94}
</style>
<script>if(new URLSearchParams(location.search).get('entrar')==='1'){document.documentElement.classList.add('intro');history.replaceState(null,'','/');}</script>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;display=swap" rel="stylesheet">
<style>
#intro{display:none}
html.intro #intro{display:flex;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#3A0507 0%,#120203 45%,#000000 100%)}
html.intro body{overflow:hidden}
.intro-fly{position:fixed;z-index:1001;transform-origin:0 0;pointer-events:none;margin:0}
.brand-logo{display:flex;align-items:center;gap:clamp(6px,1.5vw,14px)}
.brand-icon{width:clamp(110px,22vw,190px);height:auto;flex:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.brand-text{display:flex;flex-direction:column;line-height:.82;font-family:'Kaushan Script',cursive}
.brand-text .art{font-size:clamp(64px,13vw,124px);color:#FFFFFF;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.brand-text .som{font-size:clamp(42px,8.5vw,80px);color:#E50000;margin-left:clamp(26px,5vw,52px);margin-top:clamp(-4px,-.5vw,0px)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="position: relative; overflow: hidden; min-height: 100vh; box-sizing: border-box; padding: 28px 24px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FAFAFA; background: #09090B">
<div aria-hidden="true" style="position: absolute; top: -160px; left: 22%; width: 560px; height: 560px; border-radius: 50%; background: #C40000; filter: blur(150px); opacity: 0.22"></div>
<div aria-hidden="true" style="position: absolute; top: 520px; right: -120px; width: 520px; height: 520px; border-radius: 50%; background: #B00000; filter: blur(150px); opacity: 0.2"></div>
<div aria-hidden="true" style="position: absolute; bottom: -180px; left: -120px; width: 480px; height: 480px; border-radius: 50%; background: #5C0000; filter: blur(130px); opacity: 0.35"></div>

<div style="position: relative; max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<div style="flex: 0 0 76px; position: relative; z-index: 20; align-self: stretch; min-height: 640px">
<nav class="sidebar" aria-label="Menu principal" style="position: absolute; top: 0; left: 0; overflow: hidden; box-sizing: border-box; padding: 18px 15px; border-radius: 30px; background: linear-gradient(180deg, #18181B 0%, #1C0A0C 100%); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px -16px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: stretch; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-left: 1px">
<div data-logo-slot="1" style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: linear-gradient(135deg, #FF2E2E, #C40000); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(229,0,0,0.6)">
<svg width="30" height="25" viewBox="0 0 120 100" aria-hidden="true"><g transform="translate(16 0) skewX(-10)"><path d="M4 37 L20 33 L20 67 L4 63 Z" fill="#FFFFFF"></path><path d="M25 32 L52 11 L52 89 L25 68 Z" fill="#FFFFFF"></path><path d="M64 37 Q71 50 64 63" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"></path><path d="M77 26 Q90 50 77 74" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"></path><path d="M90 15 Q110 50 90 85" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"></path></g></svg>
</div>
<span class="nav-label" style="font-size: 17px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em">ArtSom</span>
</div>
<sc-for list="{{ mainNav }}" as="n" hint-placeholder-count="4">
<sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
<button class="nav-btn active" onClick="{{ n.pick }}" aria-label="{{ n.label }}" aria-current="page" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: #E50000; color: #FFFFFF; box-shadow: 0 8px 22px -8px rgba(229,0,0,0.8); display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #C40000; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
<sc-if value="{{ n.inactive }}" hint-placeholder-val="{{ true }}">
<button class="nav-btn" onClick="{{ n.pick }}" aria-label="{{ n.label }}" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E50000; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
</sc-for>
<div style="height: 1px; width: 100%; background: rgba(255,255,255,0.1); margin: 8px 0"></div>
<sc-for list="{{ sysNav }}" as="n" hint-placeholder-count="4">
<sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
<button class="nav-btn active" onClick="{{ n.pick }}" aria-label="{{ n.label }}" aria-current="page" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: #E50000; color: #FFFFFF; box-shadow: 0 8px 22px -8px rgba(229,0,0,0.8); display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #C40000; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
<sc-if value="{{ n.inactive }}" hint-placeholder-val="{{ true }}">
<button class="nav-btn" onClick="{{ n.pick }}" aria-label="{{ n.label }}" style="width: 100%; height: 46px; flex: none; border: 0; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
<span class="nav-label">{{ n.label }}</span>
<sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span class="nav-label" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E50000; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
</button>
</sc-if>
</sc-for>
<a class="nav-btn" href="/api/logout" aria-label="Sair" style="width: 100%; height: 46px; flex: none; border-radius: 16px; background: transparent; color: #A1A1AA; display: flex; align-items: center; gap: 14px; padding: 0 13px; box-sizing: border-box; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
<span class="nav-label">Sair</span>
</a>
</nav>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-if value="{{ screens.overview }}" hint-placeholder-val="{{ true }}">
<div class="screen" style="display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<section class="lift" style="flex: 2 1 520px; position: relative; overflow: hidden; box-sizing: border-box; padding: 34px 36px; border-radius: 30px; background: linear-gradient(135deg, #1A0508 0%, #5C0000 55%, #C40000 100%); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px -18px rgba(196,0,0,0.55)">
<div aria-hidden="true" style="position: absolute; right: -60px; top: -80px; width: 300px; height: 300px; border-radius: 50%; background: #FF2E2E; filter: blur(70px); opacity: 0.45"></div>
<div aria-hidden="true" style="position: absolute; right: 40px; bottom: -40px; width: 180px; height: 180px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18)"></div>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 28px; justify-content: space-between; align-items: flex-end">
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); color: #FFC2C2">Novembro · 2026</span>
<h1 style="margin: 0; font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Seu dinheiro, <span style="font-style: italic; color: #FF5C5C">sob controle</span></h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #E4E4E7; max-width: 420px">Acompanhe entradas, saídas e metas em um só lugar e veja para onde cada real está indo.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px">
<button class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 999px; background: #FFFFFF; color: #B00000; font-size: 14px; font-weight: 700; cursor: pointer" onClick="{{ go.sales }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Nova venda</button>
<button class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer" onClick="{{ go.reports }}">Ver relatório</button>
</div>
</div>
<div style="flex: 0 1 auto; display: flex; flex-direction: column; gap: 6px; padding: 20px 24px; border-radius: 22px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(14px)">
<span style="font-size: 13px; color: #FFC2C2">Saldo total</span>
<span style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em">R$ 48.320,90</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4ADE80">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>+8,2% em relação a outubro</span>
</div>
</div>
</section>

<section class="glass" style="flex: 1 1 320px; box-sizing: border-box; padding: 26px; border-radius: 30px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Novembro, 2026</h2>
<div style="display: flex; gap: 6px">
<button aria-label="Semana anterior" style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #F4F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button aria-label="Próxima semana" style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #F4F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}">
<div class="day" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 16px; background: linear-gradient(180deg, #E50000, #8B0000); color: #FFFFFF; box-shadow: 0 10px 22px -8px rgba(229,0,0,0.7)">
<span style="font-size: 11px; font-weight: 600; color: #FFC2C2">{{ d.wd }}</span>
<span style="font-size: 17px; font-weight: 700">{{ d.n }}</span>
<span style="width: 5px; height: 5px; border-radius: 50%; background: #FFFFFF"></span>
</div>
</sc-if>
<sc-if value="{{ d.other }}" hint-placeholder-val="{{ true }}">
<div class="day" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06)">
<span style="font-size: 11px; font-weight: 600; color: #8B8B94">{{ d.wd }}</span>
<span style="font-size: 17px; font-weight: 700; color: #FAFAFA">{{ d.n }}</span>
<span style="width: 5px; height: 5px; border-radius: 50%; background: {{ d.dot }}"></span>
</div>
</sc-if>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #A1A1AA; text-transform: uppercase; letter-spacing: 0.06em">Próximas contas</span>
<sc-for list="{{ bills }}" as="b" hint-placeholder-count="3">
<div class="row-hover" style="display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px">
<div style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: rgba(229,0,0,0.16); color: #FF5C5C; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
<span style="font-size: 15px; font-weight: 800">{{ b.day }}</span>
<span style="font-size: 9px; font-weight: 700">NOV</span>
</div>
<span style="flex: 1; font-size: 14px; font-weight: 600">{{ b.name }}</span>
<span style="font-size: 14px; font-weight: 700; color: #FAFAFA">{{ b.value }}</span>
</div>
</sc-for>
</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
<section class="glass" style="flex: 1 1 220px; box-sizing: border-box; padding: 22px 24px; border-radius: 26px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 600; color: #A1A1AA">{{ k.label }}</span>
<span style="width: 38px; height: 38px; border-radius: 12px; background: {{ k.chip }}; color: {{ k.chipInk }}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ k.icon1 }}"></path><path d="{{ k.icon2 }}"></path></svg>
</span>
</div>
<span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">{{ k.value }}</span>
<div style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden">
<div style="height: 100%; width: {{ k.pct }}%; border-radius: 999px; background: {{ k.bar }}"></div>
</div>
<span style="font-size: 13px; font-weight: 600; color: {{ k.noteInk }}">{{ k.note }}</span>
</section>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<section class="glass" style="flex: 2 1 520px; box-sizing: border-box; padding: 26px 28px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Fluxo de caixa</h2>
<span style="font-size: 13px; color: #A1A1AA">Entradas <strong style="color: #4ADE80">{{ inTotal }}</strong> · Saídas <strong style="color: #D4D4D8">{{ outTotal }}</strong></span>
</div>
<div role="group" aria-label="Período" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{ periods }}" as="p" hint-placeholder-count="2">
<sc-if value="{{ p.active }}" hint-placeholder-val="{{ false }}">
<button class="pill" onClick="{{ p.pick }}" aria-pressed="true" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #C40000; color: #FFFFFF; box-shadow: 0 6px 16px -6px rgba(229,0,0,0.8); font-size: 13px; font-weight: 700; cursor: pointer">{{ p.label }}</button>
</sc-if>
<sc-if value="{{ p.inactive }}" hint-placeholder-val="{{ true }}">
<button class="pill" onClick="{{ p.pick }}" aria-pressed="false" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #D4D4D8; font-size: 13px; font-weight: 600; cursor: pointer">{{ p.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 18px; font-size: 12px; font-weight: 600; color: #A1A1AA">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #22C55E"></span>Entradas</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A1A1AA"></span>Saídas</span>
</div>

function get(path, scope){

}
function interp(str, scope){

    }
    if (!slot || !overlay.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      if (overlay.animate) overlay.animate([{opacity:1},{opacity:0}], {duration:300, fill:'forwards'}).finished.then(done); else done();
      return;
    }
    var a = icon.getBoundingClientRect();
    var b = slot.getBoundingClientRect();
    var fly = icon.cloneNode(true);
    fly.classList.add('intro-fly');
    fly.style.left = a.left + 'px'; fly.style.top = a.top + 'px';
    fly.style.width = a.width + 'px'; fly.style.height = a.height + 'px';
    document.body.appendChild(fly);
    icon.style.visibility = 'hidden';
    slot.style.opacity = '0';

    var s = b.width / a.width, dx = b.left - a.left, dy = b.top - a.top;
    var cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    var R = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy)) + 40;

    var anims = [
      text.animate([
        { opacity: 1, transform: 'translateX(0)', filter: 'blur(0px)' },
        { opacity: 0, transform: 'translateX(26px) scale(.96)', filter: 'blur(8px)' }
      ], opts(T.textOut, EASE_OUT)),
      fly.animate([
        { transform: 'translate(0px,0px) scale(1) rotate(0deg)', filter: 'drop-shadow(0 6px 0 rgba(0,0,0,.18))', offset: 0 },
        { transform: 'translate(' + (dx*0.5) + 'px,' + (dy*0.42) + 'px) scale(' + ((1+s)/2) + ') rotate(-6deg)', offset: 0.5 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (s*1.14) + ') rotate(2deg)', offset: 0.86 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ') rotate(0deg)', filter: 'drop-shadow(0 0 0 rgba(0,0,0,0))', offset: 1 }
      ], opts(T.iconFly, EASE_IN_OUT)),
      overlay.animate([
        { clipPath: 'circle(' + R + 'px at ' + cx + 'px ' + cy + 'px)' },
        { clipPath: 'circle(0px at ' + cx + 'px ' + cy + 'px)' }
      ], opts(T.reveal, EASE_REVEAL)),
      app.animate([{ opacity: 0 }, { opacity: 1 }], opts(T.appIn, EASE_OUT))
    ];
    anims[1].finished.then(function(){
      slot.style.opacity = '';
      fly.animate([{opacity:1},{opacity:0}], {duration:120, easing:'linear', fill:'forwards'}).finished.then(function(){ fly.remove(); });
    });
    Promise.all(anims.map(function(x){ return x.finished; })).then(done);
  }
  var start = function(){ requestAnimationFrame(function(){ requestAnimationFrame(run); }); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
